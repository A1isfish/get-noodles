<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Evidence Recovery</title>

<!--
CASE NOTE:
Rendered output cannot be trusted.
Evidence may exist below the presentation layer.
-->

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  min-height: 100vh;
  padding: 24px;
  background:
    radial-gradient(circle at center, #101010 0%, #050505 48%, #000 100%);
  color: #dadada;
  font-family: "Courier New", monospace;
  display: flex;
  align-items: center;
  justify-content: center;
}

body::before {
  content: "";
  position: fixed;
  inset: 0;
  pointer-events: none;
  background:
    repeating-linear-gradient(
      to bottom,
      rgba(255,255,255,.018) 0,
      rgba(255,255,255,.018) 1px,
      transparent 1px,
      transparent 5px
    );
}

.panel {
  width: 100%;
  max-width: 650px;
  border: 1px solid #272727;
  background: rgba(0,0,0,.74);
  padding: 30px 24px;
}

.status {
  color: #777;
  letter-spacing: 3px;
  font-size: 11px;
  margin-bottom: 18px;
}

h1 {
  margin: 0;
  color: #eee;
  font-size: clamp(30px, 8vw, 54px);
  letter-spacing: 4px;
  line-height: 1;
}

.line {
  border-top: 1px solid #222;
  margin: 28px 0;
}

.row {
  display: flex;
  justify-content: space-between;
  gap: 20px;
  margin: 14px 0;
  font-size: 12px;
}

.key {
  color: #666;
}

.value {
  color: #aaa;
  text-align: right;
}

.bad {
  color: #a84c4c;
}

.notice {
  margin-top: 30px;
  padding: 16px;
  border-left: 3px solid #555;
  background: #060606;
  color: #777;
  font-size: 11px;
  line-height: 1.7;
}

.footer {
  margin-top: 26px;
  color: #3f3f3f;
  text-align: right;
  font-size: 9px;
  letter-spacing: 2px;
}
</style>
</head>

<body>

<div class="panel">

  <div class="status">
    INCIDENT RESPONSE // SOTF-003
  </div>

  <h1>EVIDENCE<br>RECOVERY</h1>

  <div class="line"></div>

  <div class="row">
    <span class="key">ARTIFACT:</span>
    <span class="value">BIOLOGICAL SAMPLE</span>
  </div>

  <div class="row">
    <span class="key">SOURCE:</span>
    <span class="value">UNKNOWN</span>
  </div>

  <div class="row">
    <span class="key">RENDERED DATA:</span>
    <span class="value bad">CORRUPTED</span>
  </div>

  <div class="row">
    <span class="key">RECOVERED:</span>
    <span class="value bad">0 BYTES</span>
  </div>

  <div class="notice">
    No actionable evidence recovered from rendered output.<br>
    Manual analysis required.
  </div>

  <div class="footer">
    SURVIVAL SYSTEM // FORENSICS
  </div>

</div>

</body>
</html>
